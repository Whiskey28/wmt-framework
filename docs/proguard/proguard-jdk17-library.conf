# ProGuard 规则：wmt-framework-jdk17 库模块（如 wmt-common）
# 设计原则：库 JAR 禁止 shrink/optimize，避免消费方反射/Spring/Jackson 运行时失败

# ========== 基础 ==========
-dontshrink
-dontoptimize
-verbose
# Java 7+ 勿使用 -dontpreverify，否则运行期 VerifyError（stackmap frame）

# 元数据：保留注解/泛型/异常表；剥离源文件名与行号（降低 jadx 可读性，不影响运行）
-renamesourcefileattribute ProGuard
-keepattributes Signature,InnerClasses,EnclosingMethod,Exceptions,RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations,AnnotationDefault

# ========== 对外稳定 API（业务方直接依赖） ==========
-keep class com.wmt.framework.common.pojo.** { *; }
-keep class com.wmt.framework.common.exception.** { *; }
-keep class com.wmt.framework.common.enums.** { *; }
-keep class com.wmt.framework.common.core.** { *; }
-keep class com.wmt.framework.common.biz.** { *; }

# 工具类：保留 public 方法签名，允许混淆方法体与 private 成员
-keep class com.wmt.framework.common.util.** {
    public <methods>;
    public <fields>;
}

# ========== Jakarta Validation（Hibernate Validator 按类名加载） ==========
-keep @jakarta.validation.Constraint class * { *; }
-keep class * implements jakarta.validation.ConstraintValidator { *; }
-keep class com.wmt.framework.common.validation.** { *; }

# ========== Jackson 自定义序列化（按类注册，类名不能变） ==========
-keep class com.wmt.framework.common.util.json.databind.** { *; }

# ========== 枚举 ==========
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# ========== 序列化 ==========
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# ========== Hutool 继承链（避免混淆后找不到父类方法） ==========
-keep class com.wmt.framework.common.util.spring.SpringUtils { *; }
-keep class cn.hutool.extra.spring.SpringUtil {
    public *;
    protected *;
}

# ========== 第三方 provided 依赖（仅消除告警，运行时由业务方提供） ==========
-dontwarn javax.**
-dontwarn jakarta.**
-dontwarn org.springframework.**
-dontwarn org.apache.**
-dontwarn com.fasterxml.**
-dontwarn lombok.**
-dontwarn cn.hutool.**
-dontwarn org.aspectj.**
-dontwarn org.slf4j.**
-dontwarn com.google.common.**
-dontwarn com.google.guava.**
-dontwarn io.swagger.**
-dontwarn io.swagger.v3.**
-dontwarn org.springdoc.**
-dontwarn com.fhs.**
-dontwarn com.alibaba.ttl.**
-dontwarn org.apache.skywalking.**
-dontwarn com.tongweb.**
-dontwarn com.xxl.job.**
-dontwarn org.apache.kafka.**
-dontwarn org.apache.rocketmq.**
-dontwarn org.redisson.**
-dontwarn com.baomidou.**
-dontwarn org.apache.ibatis.**
-dontwarn org.apache.dubbo.**

# 库模块：不因缺失 provided 依赖而中断
-ignorewarnings

# 适度混淆（不 repackage 到根包，减少与消费方扫描冲突）
-allowaccessmodification
