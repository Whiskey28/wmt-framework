# ProGuard配置文件 - 用于代码混淆保护

# 保留注解
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# 保留泛型信息
-keepattributes Signature

# 移除行号信息（增强混淆效果）
-dontkeepattributes SourceFile,LineNumberTable

# 注意：不再保留所有public类，只保留业务方真正需要的API
# 这样可以混淆大部分内部实现类

# 保留Spring相关注解的类
-keep @org.springframework.stereotype.* class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.boot.autoconfigure.condition.* class * { *; }
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * { *; }

# 保留所有枚举类
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# 保留序列化相关
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# 保留所有包含main方法的类
-keepclasseswithmembers public class * {
    public static void main(java.lang.String[]);
}

# 不警告缺失的库
-dontwarn javax.**
-dontwarn org.springframework.**
-dontwarn org.apache.**
-dontwarn com.fasterxml.**

# 优化选项
-optimizationpasses 3
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose

# 混淆选项
-repackageclasses ''
-allowaccessmodification
# 不保留包名，增强混淆效果（但保留必要的API包）
# -keeppackagenames com.wmt.framework.**

# 不混淆指定的包（保持API清晰，Spring Boot自动配置类需要保留）
-keep class com.wmt.framework.**.config.** { *; }
-keep class com.wmt.framework.**.properties.** { *; }

# 保留Builder模式
-keep class **.*Builder {
    public <methods>;
}

# 保留实体类和DTO（业务方需要使用的API）
-keep class com.wmt.framework.**.pojo.** { *; }
-keep class com.wmt.framework.**.vo.** { *; }
-keep class com.wmt.framework.**.dto.** { *; }

# 只保留业务方真正需要的公共API类
# CommonResult、PageResult等核心POJO类
-keep class com.wmt.framework.common.pojo.** { *; }
-keep class com.wmt.framework.common.exception.** { *; }
-keep class com.wmt.framework.common.enums.** { *; }

# 工具类保留类名和方法签名，但允许混淆内部实现
-keep class com.wmt.framework.common.util.** {
    public <methods>;
}

# 保留MyBatis核心Mapper接口
-keep class com.wmt.framework.**.core.mapper.** { *; }

# 保留MyBatis Mapper接口（避免反射调用失败）
-keep interface com.wmt.framework.**.mapper.** { *; }
-keep interface com.wmt.framework.**.core.mapper.** { *; }

