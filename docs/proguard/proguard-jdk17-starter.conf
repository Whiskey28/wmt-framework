# ProGuard 规则：wmt-framework-jdk17 Spring Boot Starter 模块
# 在 proguard-jdk17-library.conf 基础上追加 Starter 专用保留项

-include proguard-jdk17-library.conf

# Spring Boot 自动配置与配置属性（类名/Bean 名需稳定）
-keep @org.springframework.stereotype.* class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.boot.autoconfigure.AutoConfiguration class * { *; }
-keep @org.springframework.boot.autoconfigure.condition.* class * { *; }
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * { *; }
-keep @org.springframework.boot.context.properties.EnableConfigurationProperties class * { *; }

-keep class com.wmt.framework.**.config.** { *; }
-keep class com.wmt.framework.**.properties.** { *; }

# Starter 组件 core 包（Filter / Interceptor / AOP / Handler 等需稳定类名）
-keep class com.wmt.framework.**.core.** { *; }

# AOP
-keep @org.aspectj.lang.annotation.Aspect class * { *; }

# MyBatis / MyBatis-Plus
-keep @org.apache.ibatis.annotations.Mapper interface * { *; }
-keep class * implements org.apache.ibatis.type.TypeHandler { *; }
-keep class * extends org.apache.ibatis.type.BaseTypeHandler { *; }
-keep class * implements com.baomidou.mybatisplus.core.handlers.MetaObjectHandler { *; }

# XXL-Job / MQ 注解驱动
-keepclassmembers class * {
    @com.xxl.job.core.handler.annotation.XxlJob <methods>;
}
-keepclassmembers class * {
    @org.springframework.kafka.annotation.KafkaListener <methods>;
}
-keepclassmembers class * {
    @org.springframework.amqp.rabbit.annotation.RabbitListener <methods>;
}
-keepclassmembers class * {
    @org.apache.rocketmq.spring.annotation.RocketMQMessageListener <methods>;
}

# EnvironmentPostProcessor / SPI
-keep class * implements org.springframework.boot.env.EnvironmentPostProcessor { *; }
-keep class * implements org.springframework.context.ApplicationListener { *; }

# MyBatis Mapper 接口
-keep interface com.wmt.framework.**.mapper.** { *; }
-keep interface com.wmt.framework.**.core.mapper.** { *; }
-keep class com.wmt.framework.**.core.mapper.** { *; }

# VO/DTO（对外 API）
-keep class com.wmt.framework.**.pojo.** { *; }
-keep class com.wmt.framework.**.vo.** { *; }
-keep class com.wmt.framework.**.dto.** { *; }

# Builder（Lombok）
-keep class **.*Builder {
    public <methods>;
}
