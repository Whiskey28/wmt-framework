# WMT XXL-JOB Starter 配置示例（xxl-job-core 3.1.1）
# 配置前缀为 xxl.job.*，与官方一致

xxl:
  job:
    # 是否启用执行器（local 无 Admin 时建议 false）
    enabled: true
    # 与 xxl-job-admin 3.1.1 调度中心配置的 accessToken 保持一致
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      # 调度中心地址（TongWeb 版 admin 同样使用该 context-path）
      addresses: http://127.0.0.1:8088/xxl-job-admin
    executor:
      # 执行器 AppName，须在 Admin「执行器管理」中注册且一致
      appname: ahzx-boim-svc
      # 多网卡/容器环境建议显式配置；为空则自动探测
      ip:
      address:
      port: 9999
      logpath: ./logs/xxl-job
      # 3.1.1 起官方最小保留 3 天
      logretentiondays: 30

# 建议全环境排除 Quartz（已迁移至 XXL-Job）
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
