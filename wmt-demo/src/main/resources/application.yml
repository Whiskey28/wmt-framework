server:
  port: 8080
  servlet:
    context-path: /demo

spring:
  application:
    name: wmt-demo
  profiles:
    active: dev
  
  main:
    allow-circular-references: true # 允许循环依赖
  
  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  
  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 Date 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.20.10.2:33060/wmt_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    # Druid连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000

  # Redis配置
  redis:
    host: 172.20.10.2
    port: 6379
    password: Ab123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 1h # 1小时
  
  # Spring Data Redis 配置
  data:
    redis:
      repositories:
        enabled: false # 项目未使用 Spring Data Redis 的 Repository，禁用以提升启动速度

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true # 参数对象扁平化

knife4j:
  enable: true
  setting:
    language: zh_cn

--- #################### 数据库配置 ####################

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true，但显示去指定下
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: NONE # "智能"模式，基于数据源类型自动适配
      logic-delete-field: deleted
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${wmt.info.base-package}.entity
  mapper-locations: classpath*:mapper/*.xml

--- #################### 定时任务配置 ####################

# XXL-JOB配置
xxl:
  job:
    # 是否启用，默认false
    enabled: false
    # 访问令牌（与调度中心配置一致）
    access-token: default_token
    admin:
      # 调度中心地址
      addresses: http://172.20.10.2:8080/xxl-job-admin
    executor:
      # 执行器AppName（与调度中心注册名称一致）
      appname: wmt-demo-executor
      # 执行器注册地址，为空则自动获取
      address:
      # 执行器IP，为空则自动获取
      ip:
      # 执行器端口
      port: 9999
      # 执行器日志路径
      logpath: ./logs/xxl-job
      # 执行器日志保留天数
      logretentiondays: 30

--- #################### WMT框架配置 ####################

# WMT框架配置
wmt:
  # 基础信息配置
  info:
    version: 1.0.0
    # 项目基础包路径（用于Mapper扫描等）
    base-package: com.wmt.demo
  
  # Web配置
  web:
    # Admin UI配置（必需）
    admin-ui:
      url: http://localhost:8080/demo # Admin 管理后台 UI 的地址
    
    # API配置
    app-api:
      prefix: /app-api
      controller: "**.controller.app.**"
    admin-api:
      prefix: /admin-api
      controller: "**.controller.admin.**"
    
    # 跨域配置
    cors:
      enabled: true
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    
    # 接口文档配置
    doc:
      enabled: true
      title: WMT Demo API文档
      description: WMT组件库演示项目接口文档
      version: 1.0.0
      contact-name: WMT Team
      contact-email: support@wmt.com
  
  # Swagger配置
  swagger:
    title: WMT Demo API文档
    description: 提供WMT组件库演示的所有功能
    version: ${wmt.info.version}
    url: ${wmt.web.admin-ui.url}
    email: support@wmt.com
    license: MIT
    license-url: https://opensource.org/licenses/MIT

  # Security配置
  security:
    # 是否启用（demo项目禁用，因为需要实现OAuth2TokenCommonApi等接口）
    enabled: false
    # 排除路径（不需要认证）
    permit-all-urls:
      - /api/user/list
      - /api/user/*/test
      - /druid/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
    # Token配置
    token:
      # 令牌自定义标识
      header: Authorization
      # 令牌密钥
      secret: abcdefghijklmnopqrstuvwxyz123456
      # 令牌有效期（分钟）
      expire-time: 720

  # Redis配置
  redis:
    # 是否启用
    enabled: true

  # Excel配置
  excel:
    # 是否启用
    enabled: true

  # MyBatis配置
  mybatis:
    # 是否启用
    enabled: true
  
  # API访问日志配置
  access-log:
    # 是否启用（demo项目禁用，因为需要实现ApiAccessLogCommonApi接口）
    enable: false

# 日志配置
logging:
  level:
    root: INFO
    com.wmt: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-demo.log

