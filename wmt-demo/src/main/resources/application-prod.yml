# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://your-prod-mysql-host:3306/wmt_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: your-prod-username
    password: your-prod-password
  
  redis:
    host: your-prod-redis-host
    port: 6379
    password: your-prod-redis-password

# XXL-JOB生产配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://your-prod-xxljob-admin:8088/xxl-job-admin

# 日志配置
logging:
  level:
    root: INFO
    com.wmt: INFO

