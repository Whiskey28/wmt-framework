# WMT WebSocket Starter 配置示例
# 基于 wmt-spring-boot-starter-websocket 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-websocket-demo
  profiles:
    active: dev

# ==================== WMT WebSocket 配置 ====================
wmt:
  websocket:
    # 是否启用WebSocket功能
    enabled: true
    
    # WebSocket端点配置
    endpoint:
      # 端点路径
      path: /websocket
      # 是否允许跨域
      allow-origins: "*"
      # 是否允许凭证
      allow-credentials: true
      # 支持的子协议
      supported-subprotocols: 
        - "stomp"
        - "sockjs"
    
    # 消息发送器配置
    message-sender:
      # 发送器类型：local, redis, rocketmq, kafka, rabbitmq
      type: redis
      # 是否启用
      enabled: true
      
      # Redis发送器配置
      redis:
        # Redis键前缀
        key-prefix: "websocket:message:"
        # 消息过期时间（秒）
        expire-time: 3600
        # 是否启用消息持久化
        persistence-enabled: true
      
      # RocketMQ发送器配置
      rocketmq:
        # 主题名称
        topic: "websocket-message"
        # 标签
        tag: "broadcast"
        # 是否启用
        enabled: false
      
      # Kafka发送器配置
      kafka:
        # 主题名称
        topic: "websocket-message"
        # 分区数
        partitions: 3
        # 副本数
        replicas: 1
        # 是否启用
        enabled: false
      
      # RabbitMQ发送器配置
      rabbitmq:
        # 交换机名称
        exchange: "websocket.exchange"
        # 路由键
        routing-key: "websocket.message"
        # 是否启用
        enabled: false
    
    # 会话管理配置
    session:
      # 最大会话数
      max-sessions: 1000
      # 会话超时时间（分钟）
      timeout: 30
      # 是否启用会话心跳
      heartbeat-enabled: true
      # 心跳间隔（秒）
      heartbeat-interval: 30
      # 心跳超时时间（秒）
      heartbeat-timeout: 60
      # 是否启用会话清理
      cleanup-enabled: true
      # 清理间隔（分钟）
      cleanup-interval: 5
    
    # 消息配置
    message:
      # 最大消息大小（字节）
      max-size: 1048576 # 1MB
      # 消息队列大小
      queue-size: 1000
      # 是否启用消息压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1024
      # 是否启用消息加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
    
    # 认证配置
    authentication:
      # 是否启用认证
      enabled: true
      # 认证方式：token, session, header
      type: token
      # Token头部名称
      token-header: Authorization
      # Token前缀
      token-prefix: Bearer 
      # 是否允许匿名连接
      allow-anonymous: false
      # 认证失败重定向URL
      failure-redirect-url: /login
    
    # 权限配置
    authorization:
      # 是否启用权限验证
      enabled: true
      # 默认权限
      default-permissions:
        - "WEBSOCKET_CONNECT"
        - "WEBSOCKET_SEND"
        - "WEBSOCKET_RECEIVE"
      # 权限检查模式：strict, permissive
      mode: strict
    
    # 监控配置
    monitoring:
      # 是否启用监控
      enabled: true
      # 是否启用指标收集
      metrics-enabled: true
      # 是否启用健康检查
      health-check-enabled: true
      # 健康检查间隔（秒）
      health-check-interval: 30
      # 是否启用性能监控
      performance-monitoring: true
    
    # 日志配置
    logging:
      # 是否启用日志
      enabled: true
      # 日志级别：DEBUG, INFO, WARN, ERROR
      level: INFO
      # 是否记录连接日志
      connection-log-enabled: true
      # 是否记录消息日志
      message-log-enabled: true
      # 是否记录错误日志
      error-log-enabled: true
      # 日志保存天数
      retention-days: 7

# ==================== Redis配置（用于消息广播） ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== RocketMQ配置（可选） ====================
rocketmq:
  name-server: localhost:9876
  producer:
    group: websocket-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
    max-message-size: 4194304
    compress-message-body-threshold: 4096
    retry-next-server: true
    access-key: 
    secret-key: 
    enable-msg-trace: true
    customized-trace-topic: RMQ_SYS_TRACE_TOPIC

# ==================== Kafka配置（可选） ====================
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
    consumer:
      group-id: websocket-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval-ms: 1000

# ==================== RabbitMQ配置（可选） ====================
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 15000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 1.2

# ==================== 数据源配置（用于会话存储） ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_websocket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== 会话存储配置 ====================
spring:
  session:
    # 会话存储类型
    store-type: redis
    # 会话超时时间
    timeout: 30m
    # Redis配置
    redis:
      flush-mode: on_save
      namespace: spring:session:websocket

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-websocket-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,websocket
  endpoint:
    health:
      show-details: when-authorized
    websocket:
      enabled: true
  info:
    env:
      enabled: true
