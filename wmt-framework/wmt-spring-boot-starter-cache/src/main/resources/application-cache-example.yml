# WMT Cache Starter 配置示例
# 基于 wmt-spring-boot-starter-cache 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-cache-demo
  profiles:
    active: dev

# ==================== WMT Cache 配置 ====================
wmt:
  cache:
    # 是否启用缓存功能
    enabled: true
    
    # 缓存类型配置
    type:
      # 缓存类型：redis, caffeine, ehcache, hazelcast
      primary: redis
      # 备用缓存类型
      secondary: caffeine
      # 是否启用多级缓存
      multi-level-enabled: true
      # 多级缓存配置
      multi-level:
        # 一级缓存（本地缓存）
        level1:
          type: caffeine
          enabled: true
          max-size: 1000
          expire-time: 300
        # 二级缓存（分布式缓存）
        level2:
          type: redis
          enabled: true
          max-size: 10000
          expire-time: 3600
        # 是否启用缓存同步
        sync-enabled: true
        # 同步策略：write-through, write-behind, refresh-ahead
        sync-strategy: write-through
        # 同步间隔（秒）
        sync-interval: 30
        # 同步超时时间（秒）
        sync-timeout: 10
        # 同步重试次数
        sync-retry-count: 3
        # 同步重试间隔（秒）
        sync-retry-interval: 5
    
    # Redis缓存配置
    redis:
      # 是否启用Redis缓存
      enabled: true
      # Redis配置
      config:
        # 默认过期时间（秒）
        default-expire-time: 3600
        # 是否启用空值缓存
        null-value-enabled: true
        # 空值过期时间（秒）
        null-value-expire-time: 300
        # 是否启用缓存预热
        warm-up-enabled: true
        # 预热间隔（秒）
        warm-up-interval: 300
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用缓存压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用缓存加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用缓存签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # Caffeine缓存配置
    caffeine:
      # 是否启用Caffeine缓存
      enabled: true
      # Caffeine配置
      config:
        # 最大缓存大小
        maximum-size: 1000
        # 初始缓存大小
        initial-capacity: 100
        # 缓存过期时间（秒）
        expire-after-write: 300
        # 访问后过期时间（秒）
        expire-after-access: 300
        # 是否启用缓存刷新
        refresh-enabled: true
        # 刷新间隔（秒）
        refresh-interval: 60
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用缓存压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用缓存加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用缓存签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # Ehcache缓存配置
    ehcache:
      # 是否启用Ehcache缓存
      enabled: false
      # Ehcache配置
      config:
        # 最大缓存大小
        maximum-size: 1000
        # 初始缓存大小
        initial-capacity: 100
        # 缓存过期时间（秒）
        expire-after-write: 300
        # 访问后过期时间（秒）
        expire-after-access: 300
        # 是否启用缓存持久化
        persistence-enabled: false
        # 持久化路径
        persistence-path: ./cache
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用缓存压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用缓存加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用缓存签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # Hazelcast缓存配置
    hazelcast:
      # 是否启用Hazelcast缓存
      enabled: false
      # Hazelcast配置
      config:
        # 最大缓存大小
        maximum-size: 1000
        # 初始缓存大小
        initial-capacity: 100
        # 缓存过期时间（秒）
        expire-after-write: 300
        # 访问后过期时间（秒）
        expire-after-access: 300
        # 是否启用缓存持久化
        persistence-enabled: false
        # 持久化路径
        persistence-path: ./cache
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用缓存压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用缓存加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用缓存签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # 缓存策略配置
    strategy:
      # 缓存策略：write-through, write-behind, refresh-ahead
      type: write-through
      # 策略配置
      config:
        # 是否启用缓存写入
        write-enabled: true
        # 写入超时时间（秒）
        write-timeout: 10
        # 写入重试次数
        write-retry-count: 3
        # 写入重试间隔（秒）
        write-retry-interval: 5
        # 是否启用缓存读取
        read-enabled: true
        # 读取超时时间（秒）
        read-timeout: 10
        # 读取重试次数
        read-retry-count: 3
        # 读取重试间隔（秒）
        read-retry-interval: 5
        # 是否启用缓存删除
        delete-enabled: true
        # 删除超时时间（秒）
        delete-timeout: 10
        # 删除重试次数
        delete-retry-count: 3
        # 删除重试间隔（秒）
        delete-retry-interval: 5
        # 是否启用缓存更新
        update-enabled: true
        # 更新超时时间（秒）
        update-timeout: 10
        # 更新重试次数
        update-retry-count: 3
        # 更新重试间隔（秒）
        update-retry-interval: 5
        # 是否启用缓存清理
        cleanup-enabled: true
        # 清理间隔（秒）
        cleanup-interval: 300
        # 清理超时时间（秒）
        cleanup-timeout: 30
        # 清理重试次数
        cleanup-retry-count: 3
        # 清理重试间隔（秒）
        cleanup-retry-interval: 5
    
    # 缓存监控配置
    monitoring:
      # 是否启用缓存监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用缓存统计
      statistics-enabled: true
      # 缓存统计保留天数
      statistics-retention: 30
      # 是否启用缓存告警
      alerting-enabled: true
      # 缓存告警阈值配置
      alerting-thresholds:
        # 缓存命中率阈值（百分比）
        hit-rate: 80
        # 缓存未命中率阈值（百分比）
        miss-rate: 20
        # 缓存错误率阈值（百分比）
        error-rate: 5
        # 缓存响应时间阈值（毫秒）
        response-time: 1000
        # 缓存内存使用率阈值（百分比）
        memory-usage: 80
        # 缓存磁盘使用率阈值（百分比）
        disk-usage: 80
        # 缓存网络延迟阈值（毫秒）
        network-latency: 1000
        # 缓存数据库延迟阈值（毫秒）
        database-latency: 1000
        # 缓存消息队列延迟阈值（毫秒）
        mq-latency: 1000
        # 缓存Elasticsearch延迟阈值（毫秒）
        elasticsearch-latency: 1000
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT Cache] 缓存监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== 数据源配置 ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_cache?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-cache-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,cache
  endpoint:
    health:
      show-details: when-authorized
    cache:
      enabled: true
  info:
    env:
      enabled: true