# WMT File Starter 配置示例
# 基于 wmt-spring-boot-starter-file 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-file-demo
  profiles:
    active: dev

# ==================== WMT File 配置 ====================
wmt:
  file:
    # 是否启用文件功能
    enabled: true
    
    # 文件上传配置
    upload:
      # 是否启用文件上传
      enabled: true
      # 上传路径
      path: ./uploads
      # 最大文件大小（字节）
      max-file-size: 10485760 # 10MB
      # 最大请求大小（字节）
      max-request-size: 20971520 # 20MB
      # 允许的文件类型
      allowed-types:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "application/msword"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      # 是否启用文件验证
      validation-enabled: true
      # 文件验证规则
      validation-rules:
        - name: "size"
          max-size: 10485760
          message: "文件大小不能超过10MB"
        - name: "type"
          allowed-types: ["image/jpeg", "image/png", "image/gif"]
          message: "只允许上传图片文件"
        - name: "name"
          pattern: "^[a-zA-Z0-9._-]+$"
          message: "文件名只能包含字母、数字、点、下划线和连字符"
        - name: "extension"
          allowed-extensions: ["jpg", "jpeg", "png", "gif", "pdf", "txt", "doc", "docx"]
          message: "不允许的文件扩展名"
      # 是否启用文件扫描
      scan-enabled: true
      # 扫描超时时间（秒）
      scan-timeout: 30
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（文件大小MB）
      alerting-threshold: 100
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
    
    # 文件下载配置
    download:
      # 是否启用文件下载
      enabled: true
      # 下载路径
      path: ./downloads
      # 是否启用文件缓存
      cache-enabled: true
      # 缓存时间（秒）
      cache-time: 3600
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用断点续传
      resume-enabled: true
      # 是否启用防盗链
      anti-leech-enabled: true
      # 防盗链密钥
      anti-leech-key: "your-anti-leech-key"
      # 是否启用下载限流
      rate-limit-enabled: true
      # 限流速率（请求/秒）
      rate-limit-rate: 10
      # 限流容量
      rate-limit-capacity: 100
      # 是否启用下载监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用下载统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用下载告警
      alerting-enabled: true
      # 告警阈值（下载次数）
      alerting-threshold: 1000
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
    
    # 文件存储配置
    storage:
      # 是否启用文件存储
      enabled: true
      # 存储类型：local, ftp, sftp, s3, oss, cos
      type: local
      # 存储配置
      config:
        # 本地存储配置
        local:
          # 存储路径
          path: ./storage
          # 是否启用路径分隔符
          path-separator: "/"
          # 是否启用文件权限
          permission-enabled: true
          # 文件权限
          file-permission: 644
          # 目录权限
          directory-permission: 755
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（存储空间MB）
          alerting-threshold: 1000
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
        # FTP存储配置
        ftp:
          # 是否启用
          enabled: false
          # FTP服务器地址
          host: localhost
          # FTP服务器端口
          port: 21
          # FTP用户名
          username: ftp
          # FTP密码
          password: ftp
          # FTP根目录
          root-path: /
          # 是否启用被动模式
          passive-mode: true
          # 连接超时时间（秒）
          connection-timeout: 30
          # 数据传输超时时间（秒）
          data-timeout: 30
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（连接失败次数）
          alerting-threshold: 10
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
        # SFTP存储配置
        sftp:
          # 是否启用
          enabled: false
          # SFTP服务器地址
          host: localhost
          # SFTP服务器端口
          port: 22
          # SFTP用户名
          username: sftp
          # SFTP密码
          password: sftp
          # SFTP根目录
          root-path: /
          # 是否启用密钥认证
          key-auth-enabled: false
          # 密钥文件路径
          key-file-path: 
          # 密钥密码
          key-password: 
          # 连接超时时间（秒）
          connection-timeout: 30
          # 数据传输超时时间（秒）
          data-timeout: 30
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（连接失败次数）
          alerting-threshold: 10
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
        # S3存储配置
        s3:
          # 是否启用
          enabled: false
          # S3服务地址
          endpoint: https://s3.amazonaws.com
          # S3区域
          region: us-east-1
          # S3访问密钥
          access-key: your-access-key
          # S3秘密密钥
          secret-key: your-secret-key
          # S3存储桶名称
          bucket-name: your-bucket
          # S3路径前缀
          path-prefix: files/
          # 是否启用路径样式访问
          path-style-access: false
          # 是否启用虚拟主机样式访问
          virtual-host-style-access: true
          # 连接超时时间（秒）
          connection-timeout: 30
          # 数据传输超时时间（秒）
          data-timeout: 30
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（连接失败次数）
          alerting-threshold: 10
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
        # OSS存储配置
        oss:
          # 是否启用
          enabled: false
          # OSS服务地址
          endpoint: https://oss-cn-hangzhou.aliyuncs.com
          # OSS访问密钥
          access-key: your-access-key
          # OSS秘密密钥
          secret-key: your-secret-key
          # OSS存储桶名称
          bucket-name: your-bucket
          # OSS路径前缀
          path-prefix: files/
          # 连接超时时间（秒）
          connection-timeout: 30
          # 数据传输超时时间（秒）
          data-timeout: 30
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（连接失败次数）
          alerting-threshold: 10
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
        # COS存储配置
        cos:
          # 是否启用
          enabled: false
          # COS服务地址
          endpoint: https://cos.ap-beijing.myqcloud.com
          # COS访问密钥
          access-key: your-access-key
          # COS秘密密钥
          secret-key: your-secret-key
          # COS存储桶名称
          bucket-name: your-bucket
          # COS路径前缀
          path-prefix: files/
          # 连接超时时间（秒）
          connection-timeout: 30
          # 数据传输超时时间（秒）
          data-timeout: 30
          # 是否启用文件监控
          monitoring-enabled: true
          # 监控间隔（秒）
          monitoring-interval: 30
          # 是否启用文件统计
          statistics-enabled: true
          # 统计保留天数
          statistics-retention: 30
          # 是否启用文件告警
          alerting-enabled: true
          # 告警阈值（连接失败次数）
          alerting-threshold: 10
          # 告警重试次数
          alerting-retry-count: 3
          # 告警重试间隔（秒）
          alerting-retry-interval: 60
    
    # 文件处理配置
    processing:
      # 是否启用文件处理
      enabled: true
      # 处理类型：image, video, audio, document
      type: image
      # 处理配置
      config:
        # 图片处理配置
        image:
          # 是否启用图片处理
          enabled: true
          # 图片格式：jpeg, png, gif, webp
          format: jpeg
          # 图片质量（1-100）
          quality: 80
          # 图片宽度
          width: 800
          # 图片高度
          height: 600
          # 是否启用图片缩放
          resize-enabled: true
          # 缩放模式：fit, fill, crop
          resize-mode: fit
          # 是否启用图片水印
          watermark-enabled: false
          # 水印文本
          watermark-text: "WMT File"
          # 水印位置
          watermark-position: bottom-right
          # 水印透明度
          watermark-opacity: 0.5
          # 是否启用图片旋转
          rotate-enabled: false
          # 旋转角度
          rotate-angle: 0
          # 是否启用图片翻转
          flip-enabled: false
          # 翻转方向：horizontal, vertical
          flip-direction: horizontal
          # 是否启用图片滤镜
          filter-enabled: false
          # 滤镜类型：blur, sharpen, grayscale, sepia
          filter-type: blur
          # 滤镜强度
          filter-intensity: 0.5
        # 视频处理配置
        video:
          # 是否启用视频处理
          enabled: false
          # 视频格式：mp4, avi, mov, wmv
          format: mp4
          # 视频质量（1-100）
          quality: 80
          # 视频宽度
          width: 1280
          # 视频高度
          height: 720
          # 视频帧率
          frame-rate: 30
          # 视频比特率
          bit-rate: 1000
          # 是否启用视频压缩
          compression-enabled: true
          # 压缩算法
          compression-algorithm: h264
          # 是否启用视频水印
          watermark-enabled: false
          # 水印文本
          watermark-text: "WMT File"
          # 水印位置
          watermark-position: bottom-right
          # 水印透明度
          watermark-opacity: 0.5
          # 是否启用视频旋转
          rotate-enabled: false
          # 旋转角度
          rotate-angle: 0
          # 是否启用视频翻转
          flip-enabled: false
          # 翻转方向：horizontal, vertical
          flip-direction: horizontal
          # 是否启用视频滤镜
          filter-enabled: false
          # 滤镜类型：blur, sharpen, grayscale, sepia
          filter-type: blur
          # 滤镜强度
          filter-intensity: 0.5
        # 音频处理配置
        audio:
          # 是否启用音频处理
          enabled: false
          # 音频格式：mp3, wav, aac, ogg
          format: mp3
          # 音频质量（1-100）
          quality: 80
          # 音频采样率
          sample-rate: 44100
          # 音频比特率
          bit-rate: 128
          # 音频声道
          channels: 2
          # 是否启用音频压缩
          compression-enabled: true
          # 压缩算法
          compression-algorithm: mp3
          # 是否启用音频水印
          watermark-enabled: false
          # 水印文本
          watermark-text: "WMT File"
          # 水印位置
          watermark-position: bottom-right
          # 水印透明度
          watermark-opacity: 0.5
          # 是否启用音频旋转
          rotate-enabled: false
          # 旋转角度
          rotate-angle: 0
          # 是否启用音频翻转
          flip-enabled: false
          # 翻转方向：horizontal, vertical
          flip-direction: horizontal
          # 是否启用音频滤镜
          filter-enabled: false
          # 滤镜类型：blur, sharpen, grayscale, sepia
          filter-type: blur
          # 滤镜强度
          filter-intensity: 0.5
        # 文档处理配置
        document:
          # 是否启用文档处理
          enabled: false
          # 文档格式：pdf, doc, docx, txt
          format: pdf
          # 文档质量（1-100）
          quality: 80
          # 文档宽度
          width: 800
          # 文档高度
          height: 600
          # 是否启用文档压缩
          compression-enabled: true
          # 压缩算法
          compression-algorithm: gzip
          # 是否启用文档水印
          watermark-enabled: false
          # 水印文本
          watermark-text: "WMT File"
          # 水印位置
          watermark-position: bottom-right
          # 水印透明度
          watermark-opacity: 0.5
          # 是否启用文档旋转
          rotate-enabled: false
          # 旋转角度
          rotate-angle: 0
          # 是否启用文档翻转
          flip-enabled: false
          # 翻转方向：horizontal, vertical
          flip-direction: horizontal
          # 是否启用文档滤镜
          filter-enabled: false
          # 滤镜类型：blur, sharpen, grayscale, sepia
          filter-type: blur
          # 滤镜强度
          filter-intensity: 0.5
    
    # 文件监控配置
    monitoring:
      # 是否启用文件监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 文件统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 文件告警阈值配置
      alerting-thresholds:
        # 文件上传失败率阈值（百分比）
        upload-failure-rate: 5
        # 文件下载失败率阈值（百分比）
        download-failure-rate: 5
        # 文件处理失败率阈值（百分比）
        processing-failure-rate: 5
        # 文件存储失败率阈值（百分比）
        storage-failure-rate: 5
        # 文件响应时间阈值（毫秒）
        response-time: 1000
        # 文件存储空间阈值（MB）
        storage-space: 1000
        # 文件数量阈值
        file-count: 10000
        # 文件大小阈值（MB）
        file-size: 100
        # 文件类型阈值
        file-type: 10
        # 文件扩展名阈值
        file-extension: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT File] 文件监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== 数据源配置 ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_file?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.file: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-file-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,file
  endpoint:
    health:
      show-details: when-authorized
    file:
      enabled: true
  info:
    env:
      enabled: true
