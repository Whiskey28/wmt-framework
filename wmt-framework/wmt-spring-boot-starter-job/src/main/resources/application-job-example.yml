      # 任务执行超时时间（秒）
      execution-timeout: 300
      # 任务重试次数
      retry-count: 3
      # 任务重试间隔（秒）
      retry-interval: 60
      # 是否启用任务日志
      logging-enabled: true
      # 任务日志级别
      logging-level: INFO
      # 是否启用任务指标
      metrics-enabled: true
      # 任务指标保留天数
      metrics-retention: 30
      # 是否启用任务告警
      alerting-enabled: true
      # 任务告警阈值（秒）
      alerting-threshold: 600
      # 任务告警重试次数
      alerting-retry-count: 3
      # 任务告警重试间隔（秒）
      alerting-retry-interval: 60

# ==================== 异步任务配置 ====================
spring:
  task:
    execution:
      # 核心线程数
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 100
        keep-alive: 60s
      # 线程名称前缀
      thread-name-prefix: "async-"
      # 是否等待任务完成后关闭
      shutdown:
        await-termination: true
        await-termination-period: 30s
    scheduling:
      # 线程池大小
      pool:
        size: 10
      # 线程名称前缀
      thread-name-prefix: "scheduling-"
      # 是否等待任务完成后关闭
      shutdown:
        await-termination: true
        await-termination-period: 30s

# ==================== 数据源配置（用于Quartz存储） ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.quartz: DEBUG
    org.springframework.scheduling: DEBUG
    org.springframework.task: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-job-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,quartz
  endpoint:
    health:
      show-details: when-authorized
    quartz:
      enabled: true
  info:
    env:
      enabled: true
