      rejection-policy: caller-runs
    
    # 调度器配置
    scheduler:
      # 调度器名称
      name: QuartzScheduler
      # 调度器实例ID
      instance-id: ${spring.application.name}-${random.uuid}
      # 是否启用自动启动
      auto-startup: true
      # 启动延迟（秒）
      startup-delay: 10
      # 是否等待任务完成后关闭
      wait-for-jobs-to-complete: true
      # 等待任务完成超时时间（秒）
      await-termination-timeout: 30
      # 是否覆盖已存在的任务
      overwrite-existing-jobs: true
      # 是否启用任务恢复
      recovery-enabled: true
