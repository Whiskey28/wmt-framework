# WMT Monitor Starter 配置示例
# 基于 wmt-spring-boot-starter-monitor 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-monitor-demo
  profiles:
    active: dev

# ==================== WMT Monitor 配置 ====================
wmt:
  monitor:
    # 是否启用监控功能
    enabled: true
    
    # 链路追踪配置
    tracing:
      # 是否启用链路追踪
      enabled: true
      # 追踪器类型：skywalking, opentracing, zipkin
      type: skywalking
      # 采样率（0.0-1.0）
      sampling-rate: 1.0
      # 是否启用异步追踪
      async-enabled: true
      # 异步队列大小
      async-queue-size: 1000
      # 异步批处理大小
      async-batch-size: 100
      # 异步批处理间隔（毫秒）
      async-batch-interval: 1000
      
      # SkyWalking配置
      skywalking:
        # 是否启用
        enabled: true
        # 服务名称
        service-name: ${spring.application.name}
        # 服务实例名称
        instance-name: ${spring.application.name}-${random.uuid}
        # 后端服务地址
        backend-service: localhost:11800
        # 是否启用日志追踪
        log-trace-enabled: true
        # 是否启用SQL追踪
        sql-trace-enabled: true
        # 是否启用HTTP追踪
        http-trace-enabled: true
        # 是否启用数据库追踪
        database-trace-enabled: true
        # 是否启用Redis追踪
        redis-trace-enabled: true
        # 是否启用MQ追踪
        mq-trace-enabled: true
        # 追踪忽略路径
        ignore-paths:
          - "/actuator/**"
          - "/health"
          - "/info"
          - "/metrics"
          - "/prometheus"
        # 追踪忽略方法
        ignore-methods:
          - "GET"
        # 是否启用性能分析
        profile-enabled: true
        # 性能分析阈值（毫秒）
        profile-threshold: 1000
      
      # OpenTracing配置
      opentracing:
        # 是否启用
        enabled: false
        # 追踪器实现
        tracer: jaeger
        # Jaeger配置
        jaeger:
          service-name: ${spring.application.name}
          agent-host: localhost
          agent-port: 14268
          endpoint: http://localhost:14268/api/traces
          sampler-type: const
          sampler-param: 1
          reporter-log-spans: true
          reporter-max-queue-size: 100
          reporter-flush-interval: 1000
      
      # Zipkin配置
      zipkin:
        # 是否启用
        enabled: false
        # Zipkin服务地址
        base-url: http://localhost:9411
        # 服务名称
        service-name: ${spring.application.name}
        # 采样率
        sampling-rate: 1.0
        # 是否启用128位追踪ID
        use-128-bit-trace-id: false
    
    # 指标收集配置
    metrics:
      # 是否启用指标收集
      enabled: true
      # 指标类型：micrometer, prometheus, influxdb
      type: micrometer
      # 指标导出间隔（秒）
      export-interval: 30
      # 是否启用JVM指标
      jvm-enabled: true
      # 是否启用系统指标
      system-enabled: true
      # 是否启用应用指标
      application-enabled: true
      # 是否启用数据库指标
      database-enabled: true
      # 是否启用HTTP指标
      http-enabled: true
      # 是否启用缓存指标
      cache-enabled: true
      # 是否启用MQ指标
      mq-enabled: true
      
      # Micrometer配置
      micrometer:
        # 是否启用
        enabled: true
        # 指标前缀
        prefix: wmt
        # 是否启用通用标签
        common-tags:
          application: ${spring.application.name}
          environment: ${spring.profiles.active}
        # 是否启用JVM指标
        jvm-enabled: true
        # 是否启用系统指标
        system-enabled: true
        # 是否启用Web指标
        web-enabled: true
        # 是否启用数据库指标
        database-enabled: true
        # 是否启用缓存指标
        cache-enabled: true
        # 指标导出配置
        export:
          # 是否启用控制台导出
          console-enabled: true
          # 控制台导出间隔（秒）
          console-interval: 30
          # 是否启用日志导出
          log-enabled: false
          # 日志导出间隔（秒）
          log-interval: 60
      
      # Prometheus配置
      prometheus:
        # 是否启用
        enabled: true
        # 端点路径
        endpoint: /actuator/prometheus
        # 是否启用推送网关
        pushgateway-enabled: false
        # 推送网关地址
        pushgateway-url: http://localhost:9091
        # 推送间隔（秒）
        push-interval: 30
        # 推送任务名称
        push-job: ${spring.application.name}
        # 推送实例名称
        push-instance: ${spring.application.name}-${random.uuid}
      
      # InfluxDB配置
      influxdb:
        # 是否启用
        enabled: false
        # InfluxDB地址
        url: http://localhost:8086
        # 数据库名称
        database: metrics
        # 用户名
        username: admin
        # 密码
        password: admin
        # 批量大小
        batch-size: 1000
        # 批量间隔（毫秒）
        batch-interval: 1000
        # 连接超时（毫秒）
        connect-timeout: 1000
        # 读取超时（毫秒）
        read-timeout: 1000
    
    # 健康检查配置
    health:
      # 是否启用健康检查
      enabled: true
      # 健康检查间隔（秒）
      check-interval: 30
      # 健康检查超时（秒）
      check-timeout: 10
      # 是否启用详细健康信息
      show-details: when-authorized
      # 是否启用健康指标
      show-components: true
      # 是否启用健康状态
      show-status: true
      # 健康检查路径
      paths:
        - "/actuator/health"
        - "/actuator/health/readiness"
        - "/actuator/health/liveness"
    
    # 性能监控配置
    performance:
      # 是否启用性能监控
      enabled: true
      # 性能监控阈值（毫秒）
      threshold: 1000
      # 是否启用慢查询监控
      slow-query-enabled: true
      # 慢查询阈值（毫秒）
      slow-query-threshold: 2000
      # 是否启用慢HTTP监控
      slow-http-enabled: true
      # 慢HTTP阈值（毫秒）
      slow-http-threshold: 3000
      # 是否启用内存监控
      memory-monitoring: true
      # 内存使用率阈值（百分比）
      memory-threshold: 80
      # 是否启用CPU监控
      cpu-monitoring: true
      # CPU使用率阈值（百分比）
      cpu-threshold: 80
      # 是否启用磁盘监控
      disk-monitoring: true
      # 磁盘使用率阈值（百分比）
      disk-threshold: 80
    
    # 告警配置
    alerting:
      # 是否启用告警
      enabled: true
      # 告警类型：email, sms, webhook, slack
      types:
        - email
        - webhook
      # 告警阈值配置
      thresholds:
        # 响应时间阈值（毫秒）
        response-time: 5000
        # 错误率阈值（百分比）
        error-rate: 5
        # 内存使用率阈值（百分比）
        memory-usage: 90
        # CPU使用率阈值（百分比）
        cpu-usage: 90
        # 磁盘使用率阈值（百分比）
        disk-usage: 90
      # 告警冷却时间（分钟）
      cooldown: 5
      # 告警重试次数
      retry-count: 3
      # 告警重试间隔（分钟）
      retry-interval: 1
      
      # 邮件告警配置
      email:
        # 是否启用
        enabled: true
        # SMTP服务器
        smtp-host: smtp.gmail.com
        # SMTP端口
        smtp-port: 587
        # 用户名
        username: your-email@gmail.com
        # 密码
        password: your-password
        # 是否启用TLS
        tls-enabled: true
        # 发件人
        from: alerts@your-domain.com
        # 收件人列表
        to:
          - admin@your-domain.com
          - devops@your-domain.com
        # 邮件主题
        subject: "[WMT Monitor] 系统告警"
        # 邮件模板
        template: alert-email-template.html
      
      # Webhook告警配置
      webhook:
        # 是否启用
        enabled: true
        # Webhook URL
        url: https://your-webhook-url.com/alerts
        # 请求方法
        method: POST
        # 请求头
        headers:
          Content-Type: application/json
          Authorization: Bearer your-token
        # 请求体模板
        template: alert-webhook-template.json
        # 超时时间（秒）
        timeout: 10
        # 重试次数
        retry-count: 3

# ==================== Spring Boot Admin 配置 ====================
spring:
  boot:
    admin:
      client:
        # 是否启用
        enabled: true
        # 管理服务器地址
        url: http://localhost:8080
        # 应用名称
        name: ${spring.application.name}
        # 管理服务器用户名
        username: admin
        # 管理服务器密码
        password: admin
        # 是否启用健康检查
        health-check-enabled: true
        # 健康检查间隔（秒）
        health-check-interval: 30
        # 是否启用指标收集
        metrics-enabled: true
        # 指标收集间隔（秒）
        metrics-interval: 30
        # 是否启用日志收集
        log-collection-enabled: true
        # 日志收集间隔（秒）
        log-collection-interval: 60
        # 是否启用JMX
        jmx-enabled: true
        # 是否启用线程转储
        thread-dump-enabled: true
        # 是否启用堆转储
        heap-dump-enabled: true

# ==================== 管理端点配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized
      show-components: true
    info:
      env:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    tracing:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.boot.actuate: DEBUG
    io.micrometer: DEBUG
    org.apache.skywalking: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-monitor-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 数据源配置（用于指标存储） ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_monitor?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置（用于指标缓存） ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 1
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
