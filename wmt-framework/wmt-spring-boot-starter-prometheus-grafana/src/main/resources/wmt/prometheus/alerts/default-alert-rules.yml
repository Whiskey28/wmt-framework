groups:
  - name: wmt-app-default
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 大于 5%"
          description: "service={{ $labels.service }} env={{ $labels.env }}"

      - alert: SlowResponseP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{status!~"5.."}[5m])) by (le)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 耗时超过 800ms"
          description: "job={{ $labels.job }}"

      - alert: JvmMemoryHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "JVM 堆使用超过 85%"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "实例下线"
          description: "instance={{ $labels.instance }}"

