groups:
  - name: wmt_application_alerts
    interval: 30s
    rules:
      # JVM 内存告警
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用内存使用率过高"
          description: "{{ $labels.service }} 内存使用率超过 90%，当前值: {{ $value | humanizePercentage }}"

      # HTTP 错误率告警
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) 
          / 
          sum(rate(http_server_requests_seconds_count[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 错误率过高"
          description: "{{ $labels.service }} HTTP 5xx 错误率超过 10%"

      # 业务指标告警示例（需要业务系统埋点）
      - alert: HighOrderFailureRate
        expr: |
          sum(rate(biz_order_create_total{status="failure"}[5m])) 
          / 
          sum(rate(biz_order_create_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "订单创建失败率过高"
          description: "订单创建失败率超过 5%，当前值: {{ $value | humanizePercentage }}"

