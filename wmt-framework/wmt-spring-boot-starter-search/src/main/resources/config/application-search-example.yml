# WMT Search 配置示例
wmt:
  search:
    # 是否启用搜索功能
    enabled: true
    
    # Elasticsearch 配置
    elasticsearch:
      # 集群名称
      cluster-name: elasticsearch
      # 节点地址列表
      hosts:
        - localhost:9200
        - localhost:9201
        - localhost:9202
      # 连接超时时间（毫秒）
      connect-timeout: 5000
      # 读取超时时间（毫秒）
      read-timeout: 30000
      # 最大连接数
      max-connections: 100
      # 每个路由的最大连接数
      max-connections-per-route: 10
      # 用户名（可选）
      username: elastic
      # 密码（可选）
      password: password
      # 是否启用SSL
      ssl: false
      # 证书路径（可选）
      certificate-path: /path/to/certificate.pem
      # 是否验证证书
      verify-certificate: true
    
    # 搜索配置
    search:
      # 默认分页大小
      default-page-size: 10
      # 最大分页大小
      max-page-size: 1000
      # 默认搜索字段
      default-search-fields:
        - title
        - content
        - description
      # 是否启用搜索建议
      suggest-enabled: true
      # 搜索建议字段
      suggest-field: suggest
      # 是否启用搜索日志
      search-log-enabled: true
      # 搜索日志索引
      search-log-index: search_log
      # 是否启用热门搜索
      hot-search-enabled: true
      # 热门搜索索引
      hot-search-index: hot_search
    
    # 索引配置
    index:
      # 默认分片数
      default-shards: 1
      # 默认副本数
      default-replicas: 0
      # 默认刷新间隔（秒）
      default-refresh-interval: 1
      # 是否自动创建索引
      auto-create-index: true
      # 索引前缀
      prefix: ""
      # 索引后缀
      suffix: ""

# 日志配置
logging:
  level:
    com.wmt.framework.search: DEBUG
    org.elasticsearch.client: DEBUG
