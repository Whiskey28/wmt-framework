# WMT Data Permission Starter 配置示例
# 基于 wmt-spring-boot-starter-biz-data-permission 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-data-permission-demo
  profiles:
    active: dev

# ==================== WMT Data Permission 配置 ====================
wmt:
  data-permission:
    # 是否启用数据权限功能
    enabled: true
    
    # 权限模式配置
    mode:
      # 权限模式：field, table, database, tenant
      type: field
      # 是否启用权限隔离
      isolation-enabled: true
      # 是否启用权限验证
      validation-enabled: true
      # 验证超时时间（秒）
      validation-timeout: 30
      # 是否启用权限监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用权限统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用权限告警
      alerting-enabled: true
      # 告警阈值（权限检查次数）
      alerting-threshold: 1000
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
    
    # 权限识别配置
    identification:
      # 权限识别方式：annotation, aop, interceptor
      type: annotation
      # 权限标识字段名
      field-name: dataPermission
      # 权限标识参数名
      parameter-name: dataPermission
      # 是否启用权限验证
      validation-enabled: true
      # 验证超时时间（秒）
      validation-timeout: 30
      # 是否启用权限缓存
      cache-enabled: true
      # 缓存过期时间（秒）
      cache-expire-time: 3600
      # 是否启用权限监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用权限统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
    
    # 权限规则配置
    rules:
      # 是否启用权限规则
      enabled: true
      # 规则类型：sql, expression, script
      type: sql
      # 规则配置
      config:
        # 是否启用规则缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 是否启用规则验证
        validation-enabled: true
        # 验证超时时间（秒）
        validation-timeout: 30
        # 是否启用规则监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用规则统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用规则告警
        alerting-enabled: true
        # 告警阈值（规则执行时间毫秒）
        alerting-threshold: 1000
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用规则压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用规则加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用规则签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # 权限缓存配置
    cache:
      # 是否启用权限缓存
      enabled: true
      # 缓存类型：redis, memory
      type: redis
      # 缓存配置
      config:
        # 默认过期时间（秒）
        default-expire-time: 3600
        # 是否启用空值缓存
        null-value-enabled: true
        # 空值过期时间（秒）
        null-value-expire-time: 300
        # 是否启用缓存预热
        warm-up-enabled: true
        # 预热间隔（秒）
        warm-up-interval: 300
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
        # 是否启用缓存压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用缓存加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用缓存签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # 权限安全配置
    security:
      # 是否启用权限安全
      enabled: true
      # 安全类型：isolation, encryption, authentication
      type: isolation
      # 安全配置
      config:
        # 是否启用权限隔离
        isolation-enabled: true
        # 隔离模式：strict, permissive
        isolation-mode: strict
        # 是否启用权限加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用权限认证
        authentication-enabled: true
        # 认证超时时间（秒）
        authentication-timeout: 30
        # 是否启用权限授权
        authorization-enabled: true
        # 授权超时时间（秒）
        authorization-timeout: 30
        # 是否启用权限审计
        audit-enabled: true
        # 审计日志保留天数
        audit-log-retention: 30
        # 是否启用权限监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用权限统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用权限告警
        alerting-enabled: true
        # 告警阈值（安全事件数量）
        alerting-threshold: 100
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 权限消息队列配置
    message-queue:
      # 是否启用权限消息队列
      enabled: true
      # 消息队列类型：redis, rocketmq, kafka, rabbitmq
      type: redis
      # 消息队列配置
      config:
        # 是否启用消息持久化
        persistence-enabled: true
        # 消息过期时间（秒）
        expire-time: 3600
        # 是否启用消息压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用消息加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用消息签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用消息监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用消息统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用消息告警
        alerting-enabled: true
        # 告警阈值（消息积压数量）
        alerting-threshold: 1000
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 权限任务调度配置
    job:
      # 是否启用权限任务调度
      enabled: true
      # 任务调度类型：quartz, xxl-job
      type: quartz
      # 任务调度配置
      config:
        # 是否启用任务持久化
        persistence-enabled: true
        # 任务过期时间（秒）
        expire-time: 3600
        # 是否启用任务压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用任务加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用任务签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用任务监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用任务统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用任务告警
        alerting-enabled: true
        # 告警阈值（任务执行时间秒）
        alerting-threshold: 300
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 权限监控配置
    monitoring:
      # 是否启用权限监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用权限统计
      statistics-enabled: true
      # 权限统计保留天数
      statistics-retention: 30
      # 是否启用权限告警
      alerting-enabled: true
      # 权限告警阈值配置
      alerting-thresholds:
        # 权限检查次数阈值
        permission-check-count: 1000
        # 权限检查成功率阈值（百分比）
        permission-check-success-rate: 95
        # 权限检查响应时间阈值（毫秒）
        permission-check-response-time: 1000
        # 权限检查错误率阈值（百分比）
        permission-check-error-rate: 5
        # 权限缓存命中率阈值（百分比）
        permission-cache-hit-rate: 80
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT Data Permission] 权限监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== 数据源配置 ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_data_permission?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.data.permission: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-data-permission-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,data-permission
  endpoint:
    health:
      show-details: when-authorized
    data-permission:
      enabled: true
  info:
    env:
      enabled: true
