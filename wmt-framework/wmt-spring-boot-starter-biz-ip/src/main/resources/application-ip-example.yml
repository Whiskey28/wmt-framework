# WMT IP Starter 配置示例
# 基于 wmt-spring-boot-starter-biz-ip 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-ip-demo
  profiles:
    active: dev

# ==================== WMT IP 配置 ====================
wmt:
  ip:
    # 是否启用IP功能
    enabled: true
    
    # IP解析配置
    resolution:
      # 是否启用IP解析
      enabled: true
      # 解析类型：local, remote, hybrid
      type: hybrid
      # 解析配置
      config:
        # 是否启用本地解析
        local-enabled: true
        # 本地数据库路径
        local-database-path: classpath:ip2region.xdb
        # 是否启用远程解析
        remote-enabled: true
        # 远程解析服务地址
        remote-service-url: https://ip-api.com/json/
        # 远程解析超时时间（毫秒）
        remote-timeout: 5000
        # 远程解析重试次数
        remote-retry-count: 3
        # 远程解析重试间隔（毫秒）
        remote-retry-interval: 1000
        # 是否启用缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 缓存大小
        cache-size: 10000
        # 是否启用压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用告警
        alerting-enabled: true
        # 告警阈值（解析失败率百分比）
        alerting-threshold: 10
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # IP地理位置配置
    geolocation:
      # 是否启用地理位置
      enabled: true
      # 地理位置类型：country, region, city, district
      type: city
      # 地理位置配置
      config:
        # 是否启用国家解析
        country-enabled: true
        # 是否启用省份解析
        region-enabled: true
        # 是否启用城市解析
        city-enabled: true
        # 是否启用区县解析
        district-enabled: true
        # 是否启用ISP解析
        isp-enabled: true
        # 是否启用组织解析
        organization-enabled: true
        # 是否启用ASN解析
        asn-enabled: true
        # 是否启用时区解析
        timezone-enabled: true
        # 是否启用坐标解析
        coordinates-enabled: true
        # 是否启用缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 缓存大小
        cache-size: 10000
        # 是否启用压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用告警
        alerting-enabled: true
        # 告警阈值（解析失败率百分比）
        alerting-threshold: 10
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # IP黑名单配置
    blacklist:
      # 是否启用IP黑名单
      enabled: true
      # 黑名单类型：ip, cidr, country, region, city
      type: ip
      # 黑名单配置
      config:
        # 是否启用IP黑名单
        ip-enabled: true
        # 是否启用CIDR黑名单
        cidr-enabled: true
        # 是否启用国家黑名单
        country-enabled: true
        # 是否启用省份黑名单
        region-enabled: true
        # 是否启用城市黑名单
        city-enabled: true
        # 是否启用ISP黑名单
        isp-enabled: true
        # 是否启用组织黑名单
        organization-enabled: true
        # 是否启用ASN黑名单
        asn-enabled: true
        # 是否启用缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 缓存大小
        cache-size: 10000
        # 是否启用压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用告警
        alerting-enabled: true
        # 告警阈值（黑名单命中次数）
        alerting-threshold: 100
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # IP白名单配置
    whitelist:
      # 是否启用IP白名单
      enabled: true
      # 白名单类型：ip, cidr, country, region, city
      type: ip
      # 白名单配置
      config:
        # 是否启用IP白名单
        ip-enabled: true
        # 是否启用CIDR白名单
        cidr-enabled: true
        # 是否启用国家白名单
        country-enabled: true
        # 是否启用省份白名单
        region-enabled: true
        # 是否启用城市白名单
        city-enabled: true
        # 是否启用ISP白名单
        isp-enabled: true
        # 是否启用组织白名单
        organization-enabled: true
        # 是否启用ASN白名单
        asn-enabled: true
        # 是否启用缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 缓存大小
        cache-size: 10000
        # 是否启用压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用告警
        alerting-enabled: true
        # 告警阈值（白名单命中次数）
        alerting-threshold: 100
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # IP限流配置
    rate-limiting:
      # 是否启用IP限流
      enabled: true
      # 限流类型：ip, country, region, city
      type: ip
      # 限流配置
      config:
        # 是否启用IP限流
        ip-enabled: true
        # 是否启用国家限流
        country-enabled: true
        # 是否启用省份限流
        region-enabled: true
        # 是否启用城市限流
        city-enabled: true
        # 是否启用ISP限流
        isp-enabled: true
        # 是否启用组织限流
        organization-enabled: true
        # 是否启用ASN限流
        asn-enabled: true
        # 限流策略：token-bucket, sliding-window, fixed-window
        strategy: token-bucket
        # 限流速率（请求/秒）
        rate: 10
        # 限流容量
        capacity: 100
        # 限流时间窗口（秒）
        time-window: 60
        # 是否启用缓存
        cache-enabled: true
        # 缓存过期时间（秒）
        cache-expire-time: 3600
        # 缓存大小
        cache-size: 10000
        # 是否启用压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用告警
        alerting-enabled: true
        # 告警阈值（限流触发次数）
        alerting-threshold: 100
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # IP监控配置
    monitoring:
      # 是否启用IP监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用IP统计
      statistics-enabled: true
      # IP统计保留天数
      statistics-retention: 30
      # 是否启用IP告警
      alerting-enabled: true
      # IP告警阈值配置
      alerting-thresholds:
        # IP解析失败率阈值（百分比）
        resolution-failure-rate: 10
        # IP解析响应时间阈值（毫秒）
        resolution-response-time: 1000
        # IP黑名单命中率阈值（百分比）
        blacklist-hit-rate: 5
        # IP白名单命中率阈值（百分比）
        whitelist-hit-rate: 5
        # IP限流触发率阈值（百分比）
        rate-limit-trigger-rate: 5
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT IP] IP监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== 数据源配置 ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_ip?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.ip: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-ip-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,ip
  endpoint:
    health:
      show-details: when-authorized
    ip:
      enabled: true
  info:
    env:
      enabled: true
