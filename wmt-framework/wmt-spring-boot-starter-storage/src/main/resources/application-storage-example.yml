# WMT Storage Starter 配置示例
# 基于 wmt-spring-boot-starter-storage 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-storage-demo
  profiles:
    active: dev

# ==================== WMT Storage 配置 ====================
wmt:
  storage:
    # 是否启用存储功能
    enabled: true
    
    # 存储类型配置
    type:
      # 存储类型：local, ftp, sftp, s3, oss, cos, minio
      primary: local
      # 备用存储类型
      secondary: s3
      # 是否启用多级存储
      multi-level-enabled: true
      # 多级存储配置
      multi-level:
        # 一级存储（本地存储）
        level1:
          type: local
          enabled: true
          path: ./storage
          max-size: 1000000000 # 1GB
          expire-time: 3600
        # 二级存储（云存储）
        level2:
          type: s3
          enabled: true
          endpoint: https://s3.amazonaws.com
          region: us-east-1
          access-key: your-access-key
          secret-key: your-secret-key
          bucket-name: your-bucket
          path-prefix: files/
          max-size: 10000000000 # 10GB
          expire-time: 86400
        # 是否启用存储同步
        sync-enabled: true
        # 同步策略：write-through, write-behind, refresh-ahead
        sync-strategy: write-through
        # 同步间隔（秒）
        sync-interval: 30
        # 同步超时时间（秒）
        sync-timeout: 10
        # 同步重试次数
        sync-retry-count: 3
        # 同步重试间隔（秒）
        sync-retry-interval: 5
    
    # 本地存储配置
    local:
      # 是否启用本地存储
      enabled: true
      # 存储路径
      path: ./storage
      # 最大存储大小（字节）
      max-size: 1000000000 # 1GB
      # 存储过期时间（秒）
      expire-time: 3600
      # 是否启用路径分隔符
      path-separator: "/"
      # 是否启用文件权限
      permission-enabled: true
      # 文件权限
      file-permission: 644
      # 目录权限
      directory-permission: 755
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（存储空间MB）
      alerting-threshold: 1000
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # FTP存储配置
    ftp:
      # 是否启用FTP存储
      enabled: false
      # FTP服务器地址
      host: localhost
      # FTP服务器端口
      port: 21
      # FTP用户名
      username: ftp
      # FTP密码
      password: ftp
      # FTP根目录
      root-path: /
      # 是否启用被动模式
      passive-mode: true
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 1000000000 # 1GB
      # 存储过期时间（秒）
      expire-time: 3600
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # SFTP存储配置
    sftp:
      # 是否启用SFTP存储
      enabled: false
      # SFTP服务器地址
      host: localhost
      # SFTP服务器端口
      port: 22
      # SFTP用户名
      username: sftp
      # SFTP密码
      password: sftp
      # SFTP根目录
      root-path: /
      # 是否启用密钥认证
      key-auth-enabled: false
      # 密钥文件路径
      key-file-path: 
      # 密钥密码
      key-password: 
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 1000000000 # 1GB
      # 存储过期时间（秒）
      expire-time: 3600
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # S3存储配置
    s3:
      # 是否启用S3存储
      enabled: false
      # S3服务地址
      endpoint: https://s3.amazonaws.com
      # S3区域
      region: us-east-1
      # S3访问密钥
      access-key: your-access-key
      # S3秘密密钥
      secret-key: your-secret-key
      # S3存储桶名称
      bucket-name: your-bucket
      # S3路径前缀
      path-prefix: files/
      # 是否启用路径样式访问
      path-style-access: false
      # 是否启用虚拟主机样式访问
      virtual-host-style-access: true
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 10000000000 # 10GB
      # 存储过期时间（秒）
      expire-time: 86400
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # OSS存储配置
    oss:
      # 是否启用OSS存储
      enabled: false
      # OSS服务地址
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      # OSS访问密钥
      access-key: your-access-key
      # OSS秘密密钥
      secret-key: your-secret-key
      # OSS存储桶名称
      bucket-name: your-bucket
      # OSS路径前缀
      path-prefix: files/
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 10000000000 # 10GB
      # 存储过期时间（秒）
      expire-time: 86400
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # COS存储配置
    cos:
      # 是否启用COS存储
      enabled: false
      # COS服务地址
      endpoint: https://cos.ap-beijing.myqcloud.com
      # COS访问密钥
      access-key: your-access-key
      # COS秘密密钥
      secret-key: your-secret-key
      # COS存储桶名称
      bucket-name: your-bucket
      # COS路径前缀
      path-prefix: files/
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 10000000000 # 10GB
      # 存储过期时间（秒）
      expire-time: 86400
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # MinIO存储配置
    minio:
      # 是否启用MinIO存储
      enabled: false
      # MinIO服务地址
      endpoint: http://localhost:9000
      # MinIO访问密钥
      access-key: minioadmin
      # MinIO秘密密钥
      secret-key: minioadmin
      # MinIO存储桶名称
      bucket-name: your-bucket
      # MinIO路径前缀
      path-prefix: files/
      # 连接超时时间（秒）
      connection-timeout: 30
      # 数据传输超时时间（秒）
      data-timeout: 30
      # 最大存储大小（字节）
      max-size: 10000000000 # 10GB
      # 存储过期时间（秒）
      expire-time: 86400
      # 是否启用文件监控
      monitoring-enabled: true
      # 监控间隔（秒）
      monitoring-interval: 30
      # 是否启用文件统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用文件告警
      alerting-enabled: true
      # 告警阈值（连接失败次数）
      alerting-threshold: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 是否启用文件压缩
      compression-enabled: true
      # 压缩阈值（字节）
      compression-threshold: 1048576 # 1MB
      # 压缩算法
      compression-algorithm: gzip
      # 是否启用文件加密
      encryption-enabled: false
      # 加密密钥
      encryption-key: "your-encryption-key"
      # 加密算法
      encryption-algorithm: AES
      # 是否启用文件签名
      signature-enabled: false
      # 签名密钥
      signature-key: "your-signature-key"
      # 签名算法
      signature-algorithm: HMAC-SHA256
    
    # 存储策略配置
    strategy:
      # 存储策略：write-through, write-behind, refresh-ahead
      type: write-through
      # 策略配置
      config:
        # 是否启用存储写入
        write-enabled: true
        # 写入超时时间（秒）
        write-timeout: 10
        # 写入重试次数
        write-retry-count: 3
        # 写入重试间隔（秒）
        write-retry-interval: 5
        # 是否启用存储读取
        read-enabled: true
        # 读取超时时间（秒）
        read-timeout: 10
        # 读取重试次数
        read-retry-count: 3
        # 读取重试间隔（秒）
        read-retry-interval: 5
        # 是否启用存储删除
        delete-enabled: true
        # 删除超时时间（秒）
        delete-timeout: 10
        # 删除重试次数
        delete-retry-count: 3
        # 删除重试间隔（秒）
        delete-retry-interval: 5
        # 是否启用存储更新
        update-enabled: true
        # 更新超时时间（秒）
        update-timeout: 10
        # 更新重试次数
        update-retry-count: 3
        # 更新重试间隔（秒）
        update-retry-interval: 5
        # 是否启用存储清理
        cleanup-enabled: true
        # 清理间隔（秒）
        cleanup-interval: 300
        # 清理超时时间（秒）
        cleanup-timeout: 30
        # 清理重试次数
        cleanup-retry-count: 3
        # 清理重试间隔（秒）
        cleanup-retry-interval: 5
    
    # 存储监控配置
    monitoring:
      # 是否启用存储监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用存储统计
      statistics-enabled: true
      # 存储统计保留天数
      statistics-retention: 30
      # 是否启用存储告警
      alerting-enabled: true
      # 存储告警阈值配置
      alerting-thresholds:
        # 存储写入失败率阈值（百分比）
        write-failure-rate: 5
        # 存储读取失败率阈值（百分比）
        read-failure-rate: 5
        # 存储删除失败率阈值（百分比）
        delete-failure-rate: 5
        # 存储更新失败率阈值（百分比）
        update-failure-rate: 5
        # 存储响应时间阈值（毫秒）
        response-time: 1000
        # 存储空间使用率阈值（百分比）
        space-usage: 80
        # 存储文件数量阈值
        file-count: 10000
        # 存储文件大小阈值（MB）
        file-size: 100
        # 存储文件类型阈值
        file-type: 10
        # 存储文件扩展名阈值
        file-extension: 10
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT Storage] 存储监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== 数据源配置 ====================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wmt_storage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# ==================== Redis配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.storage: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-storage-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,storage
  endpoint:
    health:
      show-details: when-authorized
    storage:
      enabled: true
  info:
    env:
      enabled: true
