# WMT Redis Starter 配置示例
# 基于 wmt-spring-boot-starter-redis 的完整配置示例

# ==================== 基础配置 ====================
spring:
  application:
    name: wmt-redis-demo
  profiles:
    active: dev

# ==================== WMT Redis 配置 ====================
wmt:
  redis:
    # 是否启用Redis功能
    enabled: true
    
    # 连接配置
    connection:
      # 主机地址
      host: localhost
      # 端口
      port: 6379
      # 密码
      password: 
      # 数据库
      database: 0
      # 超时时间（毫秒）
      timeout: 5000
      # 连接超时时间（毫秒）
      connect-timeout: 5000
      # 读取超时时间（毫秒）
      read-timeout: 5000
      # 写入超时时间（毫秒）
      write-timeout: 5000
      # 是否启用SSL
      ssl-enabled: false
      # SSL证书路径
      ssl-cert-path: 
      # SSL密钥路径
      ssl-key-path: 
      # SSL信任证书路径
      ssl-trust-cert-path: 
      # 是否启用SSL验证
      ssl-verify-peer: true
      # 是否启用SSL验证主机名
      ssl-verify-hostname: true
    
    # 连接池配置
    pool:
      # 是否启用连接池
      enabled: true
      # 连接池类型：lettuce, jedis
      type: lettuce
      # 最大连接数
      max-active: 8
      # 最大空闲连接数
      max-idle: 8
      # 最小空闲连接数
      min-idle: 0
      # 最大等待时间（毫秒）
      max-wait: -1
      # 连接空闲时间（毫秒）
      time-between-eviction-runs: -1
      # 最小空闲时间（毫秒）
      min-evictable-idle-time: 1800000
      # 是否启用空闲连接测试
      test-while-idle: true
      # 是否启用借用连接测试
      test-on-borrow: false
      # 是否启用归还连接测试
      test-on-return: false
      # 验证查询
      validation-query: PING
      # 验证查询超时时间（毫秒）
      validation-query-timeout: 3000
      # 是否启用JMX
      jmx-enabled: true
    
    # 序列化配置
    serialization:
      # 序列化类型：json, jdk, kryo, protobuf
      type: json
      # JSON序列化配置
      json:
        # 是否启用
        enabled: true
        # 是否启用类型信息
        type-info-enabled: true
        # 类型信息属性名
        type-info-property-name: "@class"
        # 是否启用空值序列化
        null-value-enabled: true
        # 是否启用日期时间序列化
        date-time-enabled: true
        # 日期时间格式
        date-time-format: yyyy-MM-dd HH:mm:ss
        # 是否启用时区
        timezone-enabled: true
        # 时区
        timezone: Asia/Shanghai
        # 是否启用压缩
        compression-enabled: false
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
    
    # 缓存配置
    cache:
      # 是否启用缓存
      enabled: true
      # 缓存类型：redis, caffeine, ehcache
      type: redis
      # 缓存配置
      config:
        # 默认过期时间（秒）
        default-expire-time: 3600
        # 是否启用空值缓存
        null-value-enabled: true
        # 空值过期时间（秒）
        null-value-expire-time: 300
        # 是否启用缓存预热
        warm-up-enabled: true
        # 预热间隔（秒）
        warm-up-interval: 300
        # 是否启用缓存监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用缓存统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用缓存告警
        alerting-enabled: true
        # 告警阈值（缓存命中率百分比）
        alerting-threshold: 80
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 分布式锁配置
    lock:
      # 是否启用分布式锁
      enabled: true
      # 锁类型：redisson, redis
      type: redisson
      # 锁配置
      config:
        # 默认锁超时时间（秒）
        default-timeout: 30
        # 默认锁等待时间（秒）
        default-wait-time: 10
        # 是否启用锁重试
        retry-enabled: true
        # 重试次数
        retry-count: 3
        # 重试间隔（毫秒）
        retry-interval: 100
        # 是否启用锁监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用锁统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用锁告警
        alerting-enabled: true
        # 告警阈值（锁等待时间秒）
        alerting-threshold: 60
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 消息队列配置
    message-queue:
      # 是否启用消息队列
      enabled: true
      # 消息队列类型：pubsub, stream
      type: pubsub
      # 消息队列配置
      config:
        # 是否启用消息持久化
        persistence-enabled: true
        # 消息过期时间（秒）
        expire-time: 3600
        # 是否启用消息压缩
        compression-enabled: true
        # 压缩阈值（字节）
        compression-threshold: 1024
        # 压缩算法
        compression-algorithm: gzip
        # 是否启用消息加密
        encryption-enabled: false
        # 加密密钥
        encryption-key: "your-encryption-key"
        # 加密算法
        encryption-algorithm: AES
        # 是否启用消息签名
        signature-enabled: false
        # 签名密钥
        signature-key: "your-signature-key"
        # 签名算法
        signature-algorithm: HMAC-SHA256
        # 是否启用消息监控
        monitoring-enabled: true
        # 监控间隔（秒）
        monitoring-interval: 30
        # 是否启用消息统计
        statistics-enabled: true
        # 统计保留天数
        statistics-retention: 30
        # 是否启用消息告警
        alerting-enabled: true
        # 告警阈值（消息积压数量）
        alerting-threshold: 1000
        # 告警重试次数
        alerting-retry-count: 3
        # 告警重试间隔（秒）
        alerting-retry-interval: 60
    
    # 监控配置
    monitoring:
      # 是否启用监控
      enabled: true
      # 监控间隔（秒）
      interval: 30
      # 是否启用连接监控
      connection-monitoring: true
      # 连接监控间隔（秒）
      connection-monitoring-interval: 10
      # 是否启用性能监控
      performance-monitoring: true
      # 性能监控间隔（秒）
      performance-monitoring-interval: 30
      # 是否启用内存监控
      memory-monitoring: true
      # 内存监控间隔（秒）
      memory-monitoring-interval: 30
      # 是否启用统计
      statistics-enabled: true
      # 统计保留天数
      statistics-retention: 30
      # 是否启用告警
      alerting-enabled: true
      # 告警阈值配置
      alerting-thresholds:
        # 连接数阈值
        connection-count: 100
        # 内存使用率阈值（百分比）
        memory-usage: 80
        # 响应时间阈值（毫秒）
        response-time: 1000
        # 错误率阈值（百分比）
        error-rate: 5
      # 告警重试次数
      alerting-retry-count: 3
      # 告警重试间隔（秒）
      alerting-retry-interval: 60
      # 告警通知方式：email, sms, webhook
      alert-notification-types:
        - email
        - webhook
      # 告警通知配置
      alert-notification:
        # 邮件配置
        email:
          enabled: true
          smtp-host: smtp.gmail.com
          smtp-port: 587
          username: your-email@gmail.com
          password: your-password
          from: alerts@your-domain.com
          to:
            - admin@your-domain.com
            - devops@your-domain.com
          subject: "[WMT Redis] 监控告警"
        # Webhook配置
        webhook:
          enabled: true
          url: https://your-webhook-url.com/alerts
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer your-token
          timeout: 10
          retry-count: 3

# ==================== Spring Data Redis 配置 ====================
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "wmt:cache:"
      use-key-prefix: true
      cache-null-values: true

# ==================== Redisson 配置 ====================
redisson:
  # 是否启用Redisson
  enabled: true
  # 配置类型：single, cluster, sentinel, master-slave
  config-type: single
  # 单机配置
  single:
    address: redis://localhost:6379
    password: 
    database: 0
    connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
    keep-alive: true
    tcp-no-delay: false
  # 集群配置
  cluster:
    node-addresses:
      - redis://localhost:7000
      - redis://localhost:7001
      - redis://localhost:7002
    password: 
    master-connection-pool-size: 64
    slave-connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
    keep-alive: true
    tcp-no-delay: false
  # 哨兵配置
  sentinel:
    master-name: mymaster
    sentinel-addresses:
      - redis://localhost:26379
      - redis://localhost:26380
      - redis://localhost:26381
    password: 
    database: 0
    connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
    keep-alive: true
    tcp-no-delay: false
  # 主从配置
  master-slave:
    master-address: redis://localhost:6379
    slave-addresses:
      - redis://localhost:6380
      - redis://localhost:6381
    password: 
    database: 0
    connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
    keep-alive: true
    tcp-no-delay: false

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.data.redis: DEBUG
    org.redisson: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-redis-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,redis
  endpoint:
    health:
      show-details: when-authorized
    redis:
      enabled: true
  info:
    env:
      enabled: true
