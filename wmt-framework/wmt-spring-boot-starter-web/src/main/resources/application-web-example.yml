# WMT Web Starter 配置示例
# 基于 wmt-spring-boot-starter-web 的完整配置示例

# ==================== 基础配置 ====================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wmt-web-demo
  profiles:
    active: dev

# ==================== WMT Web 配置 ====================
wmt:
  # 基础信息配置
  info:
    version: 1.0.0
    base-package: com.wmt.demo

  # Web配置
  web:
    # Admin UI配置（必需）
    admin-ui:
      url: http://localhost:8080/api # Admin 管理后台 UI 的地址
    
    # API配置
    app-api:
      prefix: /app-api
      controller: "**.controller.app.**"
    admin-api:
      prefix: /admin-api
      controller: "**.controller.admin.**"
    
    # 跨域配置
    cors:
      enabled: true
      allowed-origins: 
        - "http://localhost:3000"
        - "http://localhost:8080"
        - "https://your-domain.com"
      allowed-methods: 
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed-headers: 
        - "Content-Type"
        - "Authorization"
        - "X-Requested-With"
      allow-credentials: true
      max-age: 3600
    
    # 接口文档配置
    doc:
      enabled: true
      title: WMT Web API文档
      description: WMT Web组件库接口文档
      version: 1.0.0
      contact-name: WMT Team
      contact-email: support@wmt.com
      contact-url: https://github.com/wmt-framework
      license: MIT
      license-url: https://opensource.org/licenses/MIT

  # Swagger配置
  swagger:
    title: WMT Web API文档
    description: 提供WMT Web组件库的所有功能
    version: ${wmt.info.version}
    url: ${wmt.web.admin-ui.url}
    email: support@wmt.com
    license: MIT
    license-url: https://opensource.org/licenses/MIT

# ==================== Spring Boot Web 配置 ====================
spring:
  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  
  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 Date 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean
    deserialization:
      fail-on-unknown-properties: false # 忽略未知属性
    time-zone: GMT+8 # 时区设置

# ==================== 接口文档配置 ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  default-flat-param-object: true # 参数对象扁平化

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-reload-cache-parameter: true
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: true
    enable-request-cache: true
    enable-host-text: WMT Web API
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: true
    enable-footer: true
    enable-footer-custom: true
    footer-custom-content: Copyright © 2024 WMT Framework
    enable-dynamic-parameter: true
    enable-request-cache: true

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.wmt: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/wmt-web-demo.log
    max-size: 100MB
    max-history: 30

# ==================== 管理端点配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
