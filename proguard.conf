# ProGuard配置文件 - 用于代码混淆保护

# 保留注解
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# 保留泛型信息
-keepattributes Signature

# 保留行号信息（便于调试）
-keepattributes SourceFile,LineNumberTable

# 保留所有公共类的公共方法（这些是组件的API）
-keep public class * {
    public protected *;
}

# 保留Spring相关注解的类
-keep @org.springframework.stereotype.* class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.boot.autoconfigure.condition.* class * { *; }
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * { *; }

# 保留所有枚举类
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# 保留序列化相关
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# 保留所有包含main方法的类
-keepclasseswithmembers public class * {
    public static void main(java.lang.String[]);
}

# 不警告缺失的库
-dontwarn javax.**
-dontwarn org.springframework.**
-dontwarn org.apache.**
-dontwarn com.fasterxml.**

# 优化选项
-optimizationpasses 3
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose

# 混淆选项
-repackageclasses ''
-allowaccessmodification
-keeppackagenames com.ahzx.tdc.framework.**

# 不混淆指定的包（保持API清晰）
-keep class com.ahzx.tdc.framework.**.config.** { *; }
-keep class com.ahzx.tdc.framework.**.properties.** { *; }

# 保留Builder模式
-keep class **.*Builder {
    public <methods>;
}

# 保留实体类和DTO
-keep class com.ahzx.tdc.framework.**.core.pojo.** { *; }
-keep class com.ahzx.tdc.framework.**.core.vo.** { *; }
-keep class com.ahzx.tdc.framework.**.core.dto.** { *; }

